<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<title>Producto Idealo</title>
	<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
	<sdpi-item label="URL de Idealo">
		<sdpi-textfield setting="url" placeholder="https://www.idealo.es/precios/..." required></sdpi-textfield>
	</sdpi-item>

	<sdpi-item label="Actualizar cada">
		<sdpi-select setting="refreshMinutes" default="60" placeholder="Elige frecuencia">
			<option value="1">1 minuto</option>
			<option value="15">15 minutos</option>
			<option value="30">30 minutos</option>
			<option value="60">1 hora</option>
			<option value="180">3 horas</option>
			<option value="720">12 horas</option>
		</sdpi-select>
	</sdpi-item>
</body>
</html>
